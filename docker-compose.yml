services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: home_dashboard
      POSTGRES_USER: home_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_dashboard -d home_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: home-dashboard-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  setup:
    image: home-dashboard-web:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      INITIAL_USER_FIRST_NAME: ${INITIAL_USER_FIRST_NAME:-}
      INITIAL_USER_LAST_NAME: ${INITIAL_USER_LAST_NAME:-}
      INITIAL_USER_LOGIN: ${INITIAL_USER_LOGIN:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run db:create-user"]
    restart: "no"

  migrate:
    image: home-dashboard-web:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      MARSTEK_DEVICES: ${MARSTEK_DEVICES:-[]}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

  pgadmin-passfile:
    image: node:22-bookworm-slim
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgadmin_passfile:/pgpass
      - ./docker/pgadmin/write-pgpass.mjs:/write-pgpass.mjs:ro
    command: ["node", "/write-pgpass.mjs"]
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGPASS_FILE: /pgpass/pgpass
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_passfile:/pgpass:ro
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin-passfile:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  pgadmin_passfile:
