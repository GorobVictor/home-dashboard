name: home-dashboard

services:
  postgres:
    container_name: home-dashboard-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: home_dashboard
      POSTGRES_USER: home_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_dashboard -d home_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    container_name: home-dashboard-web
    image: home-dashboard-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      HOSTNAME: 0.0.0.0
      FREELANCEHUNT_API_TOKEN: ${FREELANCEHUNT_API_TOKEN:-}
      DOCKER_CONTROL_ENABLED: ${DOCKER_CONTROL_ENABLED:-false}
      DOCKER_MONITORING_ENABLED: ${DOCKER_MONITORING_ENABLED:-false}
      DOCKER_CONTROL_TOKEN: ${DOCKER_CONTROL_TOKEN:-}
      DOCKER_CONTROL_URL: http://worker:3101
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  setup:
    image: home-dashboard-web:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      INITIAL_USER_FIRST_NAME: ${INITIAL_USER_FIRST_NAME:-}
      INITIAL_USER_LAST_NAME: ${INITIAL_USER_LAST_NAME:-}
      INITIAL_USER_LOGIN: ${INITIAL_USER_LOGIN:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:create-user"]
    restart: "no"

  migrate:
    container_name: home-dashboard-migrate
    image: home-dashboard-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  worker:
    container_name: home-dashboard-worker
    image: home-dashboard-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    # Docker Desktop sockets can be writable only by the host user. Keep the
    # normal unprivileged worker unless that permission model requires root.
    user: ${DOCKER_WORKER_USER:-node}
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      MARSTEK_DEVICES: ${MARSTEK_DEVICES:-[]}
      MARSTEK_LOW_BATTERY_PERCENT: ${MARSTEK_LOW_BATTERY_PERCENT:-20}
      FREELANCEHUNT_API_TOKEN: ${FREELANCEHUNT_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DOCKER_MONITORING_ENABLED: ${DOCKER_MONITORING_ENABLED:-false}
      DOCKER_CONTROL_ENABLED: ${DOCKER_CONTROL_ENABLED:-false}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_CONTROL_TOKEN: ${DOCKER_CONTROL_TOKEN:-}
    # When disabled, .env maps /dev/null instead of the Docker daemon socket.
    # Set DOCKER_SOCKET_PATH=/var/run/docker.sock only for Docker monitoring.
    volumes:
      - ${DOCKER_SOCKET_PATH:-/dev/null}:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  pgadmin-passfile:
    container_name: home-dashboard-pgadmin-passfile
    image: node:22-bookworm-slim
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgadmin_passfile:/pgpass
      - ./docker/pgadmin/write-pgpass.mjs:/write-pgpass.mjs:ro
    command: ["node", "/write-pgpass.mjs"]
    restart: "no"

  pgadmin:
    container_name: home-dashboard-pgadmin
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGPASS_FILE: /pgpass/pgpass
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_passfile:/pgpass:ro
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin-passfile:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  pgadmin_passfile:
