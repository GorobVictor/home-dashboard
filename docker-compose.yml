name: home-dashboard

services:
  postgres:
    container_name: home-dashboard-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: home_dashboard
      POSTGRES_USER: home_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_dashboard -d home_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    container_name: home-dashboard-web
    image: home-dashboard-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      HOSTNAME: 0.0.0.0
      FREELANCEHUNT_API_TOKEN: ${FREELANCEHUNT_API_TOKEN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  setup:
    image: home-dashboard-web:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      INITIAL_USER_FIRST_NAME: ${INITIAL_USER_FIRST_NAME:-}
      INITIAL_USER_LAST_NAME: ${INITIAL_USER_LAST_NAME:-}
      INITIAL_USER_LOGIN: ${INITIAL_USER_LOGIN:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:create-user"]
    restart: "no"

  migrate:
    container_name: home-dashboard-migrate
    image: home-dashboard-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  worker:
    container_name: home-dashboard-worker
    image: home-dashboard-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://home_dashboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/home_dashboard
      MARSTEK_DEVICES: ${MARSTEK_DEVICES:-[]}
      MARSTEK_LOW_BATTERY_PERCENT: ${MARSTEK_LOW_BATTERY_PERCENT:-20}
      FREELANCEHUNT_API_TOKEN: ${FREELANCEHUNT_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
